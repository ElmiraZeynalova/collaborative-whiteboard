name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client/colab_board

    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: board_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: |
            client/colab_board/package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Configure test database
        working-directory: ./server
        run: |
          cat > .env.test << 'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5433/board_test
          JWT_ACCESS_SECRET=test_access_secret
          JWT_REFRESH_SECRET=test_refresh_secret
          NODE_ENV=test
          EOF

      - name: Run database migrations
        working-directory: ./server
        run: npm run prisma:test

      - name: Run frontend linting
        run: npm run lint

      - name: Run Vitest unit tests
        run: npx vitest run

      - name: Build frontend
        working-directory: client/colab_board
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Configure frontend test environment
        run: |
          cat > .env.test << 'EOF'
          VITE_API_URL=http://127.0.0.1:3000
          VITE_HOCUSPOCUS_URL=ws://127.0.0.1:3000
          EOF

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/colab_board/playwright-report/
            client/colab_board/test-results/
          retention-days: 7

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./client/colab_board/dist/
          if-no-files-found: error

  test-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: board_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure test database
        run: |
          cat > .env.test << 'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5433/board_test
          JWT_ACCESS_SECRET=test_access_secret
          JWT_REFRESH_SECRET=test_refresh_secret
          NODE_ENV=test
          EOF

      - name: Run database migrations
        run: npm run prisma:test

      - name: Run backend tests
        run: npm test

      - name: Build backend
        run: npm run build
